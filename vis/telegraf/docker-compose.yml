services:
  telegraf-config-gen:
    build: ./telegraf-config-gen
    restart: unless-stopped
    environment:
      NETBOX_URL: http://netbox:8080
    command:
      - sh
      - -c
      - >-
        export NETBOX_TOKEN="nbt_$$(cat /run/secrets/netbox_api_key).$$(cat /run/secrets/netbox_api_token)" &&
        while true; do
        python -c "from telegraf_config_gen import main; main()";
        sleep 600;
        done
    volumes:
      - ./telegraf.d:/vis/telegraf/telegraf.d
      - ../snmp-bucket/profiles.yaml:/vis/snmp-bucket/profiles.yaml:ro
    secrets:
      - netbox_api_key
      - netbox_api_token

  telegraf:
    image: telegraf:1.40
    command:
      - sh
      - -c
      - >-
        export SNMP_V2_COMMUNITY="$$(cat /run/secrets/snmp_v2_community)" &&
        exec telegraf --config /etc/telegraf/telegraf.conf
        --config-directory /etc/telegraf/telegraf.d --watch-config poll
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./telegraf.d:/etc/telegraf/telegraf.d:ro
    secrets:
      - influx_token
      - snmp_v2_community
      - snmp_v3enc_auth
      - snmp_v3enc_priv
      - snmp_v3noenc_auth
    networks:
      - monitoring
      - snmp-lab

secrets:
  netbox_api_key:
    file: ../../sot/netbox-docker/secrets/superuser_api_key.txt
  netbox_api_token:
    file: ../../sot/netbox-docker/secrets/superuser_api_token.txt
  influx_token:
    file: ./secrets/influx-token.txt
  snmp_v2_community:
    file: ../snmp-bucket/secrets/snmp_v2_community.txt
  snmp_v3enc_auth:
    file: ../snmp-bucket/secrets/snmp_v3enc_auth.txt
  snmp_v3enc_priv:
    file: ../snmp-bucket/secrets/snmp_v3enc_priv.txt
  snmp_v3noenc_auth:
    file: ../snmp-bucket/secrets/snmp_v3noenc_auth.txt

networks:
  monitoring:
    name: monitoring
  snmp-lab:
    name: snmp-lab
    ipam:
      config:
        - subnet: 172.30.0.0/16
          ip_range: 172.30.255.0/24
          gateway: 172.30.255.254
