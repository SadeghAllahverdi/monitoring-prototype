[agent]
  interval = "30s"
  flush_interval = "10s"
  metric_buffer_limit = 100000
  skip_processors_after_aggregators = true

[[secretstores.docker]]
  id = "docker"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "@{docker:influx_token}"
  organization = "monitoring"
  bucket = "snmp"

[[inputs.internal]]
