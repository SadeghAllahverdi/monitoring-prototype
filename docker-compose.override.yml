# netbox -> seed -> conf gen & snmp sim
# influx db , grafana
# telegraf depens on influx & snmp sim to be there...
# for production: remove the seed, snmp-data-sim and snmp-sim parts below, and the secrets block.
# the generator stays, only its wait for seed goes.
services:
  telegraf-config-gen:
    depends_on:
      seed:
        condition: service_completed_successfully

  snmp-data-sim:
    depends_on:
      seed:
        condition: service_completed_successfully

  snmp-sim:
    depends_on:
      snmp-data-sim:
        condition: service_completed_successfully

  telegraf:
    depends_on:
      influxdb:
        condition: service_healthy
      snmp-sim:
        condition: service_started
      telegraf-config-gen:
        condition: service_started

  grafana:
    depends_on:
      influxdb:
        condition: service_healthy

secrets:
  influx_token:
    file: vis/influxdb/secrets/admin-token.txt
  influx_read_token:
    file: vis/influxdb/secrets/admin-token.txt
